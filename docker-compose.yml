version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: chitfund_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_secure
      MYSQL_DATABASE: chitfund_db
      MYSQL_USER: chitfund_user
      MYSQL_PASSWORD: chitfund_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chitfund_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "mysql://chitfund_user:chitfund_password_123@mysql:3306/chitfund_db"
      JWT_SECRET: "chitfund_super_secure_jwt_secret_key_2026!@#"
      REFRESH_TOKEN_SECRET: "chitfund_refresh_token_secret_key_2026!$%"
    depends_on:
      - mysql

volumes:
  mysql_data:
