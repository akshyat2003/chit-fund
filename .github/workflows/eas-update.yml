name: EAS Auto Update

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'app.json'
      - 'eas.json'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:

jobs:
  update:
    name: Publish Expo OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Publish update to Preview channel
        working-directory: mobile
        run: npx eas-cli update --channel preview --message "GitHub Auto-Update: ${{ github.event.head_commit.message || 'Push to main' }}" --non-interactive

      - name: Publish update to Production channel
        working-directory: mobile
        continue-on-error: true
        run: npx eas-cli update --channel production --message "GitHub Auto-Update: ${{ github.event.head_commit.message || 'Push to main' }}" --non-interactive
